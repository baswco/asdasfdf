<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>2026년 부산광역시사회복지사협회 보수교육 강사비 지급명세서 작성</title>

<!-- 카카오톡 등 링크 미리보기(Open Graph) 태그: 실제 값이 없어도 항상 이 고정된
     제목/설명/이미지로 예쁜 미리보기 카드가 뜨도록 만들어졌습니다. -->
<meta property="og:type" content="website" />
<meta property="og:title" content="2026년 부산광역시사회복지사협회 보수교육 강사비 지급명세서 작성" />
<meta property="og:description" content="강사님 성함을 입력하면 강의 정보가 자동으로 채워집니다." />
<meta property="og:image" content="https://__GITHUB_USERNAME__.github.io/__REPO_NAME__/og-image.png" />
<meta name="twitter:card" content="summary_large_image" />

<style>
  html, body {
    margin: 0;
    padding: 0;
    height: 100%;
    font-family: "Malgun Gothic", "Noto Sans KR", sans-serif;
    background: #0a6b3d;
    color: #fff;
  }
  .wrap {
    height: 100%;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: 24px;
    box-sizing: border-box;
  }
  h1 { font-size: 20px; line-height: 1.5; margin: 0 0 10px; }
  p { font-size: 14px; color: #cceee0; margin: 0; }
  a { color: #cceee0; }
</style>
</head>
<body>
  <div class="wrap">
    <h1>2026년 부산광역시사회복지사협회<br />보수교육 강사비 지급명세서 작성</h1>
    <p>잠시 후 작성 화면으로 이동합니다. 자동으로 이동하지 않으면 아래 링크를 눌러주세요.</p>
    <p style="margin-top:14px;"><a id="fallback" href="#">작성 화면으로 바로 이동</a></p>
  </div>

<script>
  // 실제 Apps Script 웹앱 주소 (배포 후 나오는 /exec 로 끝나는 주소로 바꿔주세요)
  var TARGET_URL = 'https://script.google.com/macros/s/__YOUR_SCRIPT_ID__/exec';

  // 카톡 링크에 ?name=홍길동 처럼 붙여 보내면, 그 쿼리스트링을 그대로 실제 웹앱 주소에 옮겨서 이동합니다.
  var search = window.location.search || '';
  var finalUrl = TARGET_URL + search;

  document.getElementById('fallback').href = finalUrl;

  // 사람이 열었을 때는 즉시 이동 (미리보기를 만드는 카톡/검색 봇은 JS를 실행하지 않으므로
  // 이 리다이렉트와 무관하게 위의 og: 태그만 읽고 예쁜 카드를 만듭니다)
  window.location.replace(finalUrl);
</script>
</body>
</html>
